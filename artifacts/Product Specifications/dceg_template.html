<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-101 Feature Catalog and DCEG Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <style>
        .relationship-diagram {
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            height: 400px;
            overflow: hidden;
        }
        .relationship-diagram svg {
            width: 100%;
            height: 100%;
        }
        .node circle {
            fill: #69b3a2;
            stroke: #fff;
            stroke-width: 2px;
        }
        .node text {
            font-size: 12px;
        }
        .link {
            fill: none;
            stroke: #ccc;
            stroke-width: 1px;
        }
        .sidebar-item.active {
            background-color: #4299e1;
            color: white;
        }
        .tab-button.active {
            background-color: #4299e1;
            color: white;
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease-in-out;
            }
            .sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body class="font-sans bg-gray-100 text-gray-900 h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center">
                <button id="menu-toggle" class="md:hidden mr-4 text-white focus:outline-none">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <h1 class="text-xl font-bold">S-101 Feature Catalog and DCEG Explorer</h1>
            </div>
            <div class="mt-2 md:mt-0 w-full md:w-1/3">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Search features, attributes..." 
                           class="bg-white text-gray-900 rounded-full py-2 px-4 w-full pl-10 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <div class="absolute left-3 top-2.5 text-gray-500">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar bg-gray-800 text-white w-64 md:w-72 p-4 overflow-y-auto flex-shrink-0 fixed md:static h-full md:h-auto z-10">
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-2">Feature Categories</h2>
                <div id="feature-categories" class="space-y-1">
                    <!-- Feature categories will be populated here -->
                </div>
            </div>
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-2">Information Types</h2>
                <div id="info-types" class="space-y-1">
                    <!-- Information types will be populated here -->
                </div>
            </div>
            <div>
                <h2 class="text-lg font-semibold mb-2">Attributes</h2>
                <div id="attributes-list" class="space-y-1">
                    <!-- Attributes will be populated here -->
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 overflow-y-auto">
            <div id="breadcrumb" class="mb-4 text-sm text-gray-600">
                Home > <span id="current-path">Features</span>
            </div>

            <!-- Search Results -->
            <div id="search-results" class="bg-white rounded-lg shadow-md p-4 mb-4 hidden">
                <h2 class="text-lg font-semibold mb-2">Search Results</h2>
                <div id="results-container" class="space-y-2">
                    <!-- Search results will be populated here -->
                </div>
            </div>

            <!-- Content Panel -->
            <div id="content-panel" class="bg-white rounded-lg shadow-md">
                <!-- Tabs -->
                <div class="flex border-b">
                    <button id="tab-details" class="tab-button active py-3 px-4 font-medium focus:outline-none">
                        Details
                    </button>
                    <button id="tab-dceg" class="tab-button py-3 px-4 font-medium focus:outline-none">
                        DCEG Guidance
                    </button>
                </div>

                <!-- Tab Content -->
                <div id="tab-content" class="p-4">
                    <!-- Initial content -->
                    <div id="content-details" class="tab-content">
                        <div class="text-center py-8 text-gray-500">
                            <i class="fas fa-info-circle text-4xl mb-2"></i>
                            <p>Select a feature, information type, or attribute from the sidebar to view details.</p>
                        </div>
                    </div>
                                       
                    <div id="content-dceg" class="tab-content hidden">
                        <div id="dceg-content">
                            <div class="text-center py-8 text-gray-500">
                                <i class="fas fa-book text-4xl mb-2"></i>
                                <p>Select a feature to view DCEG guidance.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

        // Populate sidebar
        function populateSidebar() {
            // Populate Feature Categories
            featureCategories.forEach(category => {
                const categoryItem = document.createElement('div');
                categoryItem.className = 'mb-2';
                categoryItem.innerHTML = `
                    <div class="flex items-center cursor-pointer hover:bg-gray-700 px-2 py-1 rounded">
                        <i class="fas fa-folder mr-2"></i>
                        <span>${category.name}</span>
                    </div>
                    <div class="ml-4 mt-1 space-y-1 category-features hidden">
                        ${category.features.map(featureId => `
                            <div class="sidebar-item cursor-pointer hover:bg-gray-700 px-2 py-1 rounded flex items-center" data-id="${featureId}" data-type="feature">
                                <i class="fas fa-map-marker-alt mr-2 text-blue-300"></i>
                                <span>${features[featureId].name}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                featureCategoriesEl.appendChild(categoryItem);

                // Add click event to expand/collapse category
                const categoryHeader = categoryItem.querySelector('.flex.items-center');
                const categoryFeatures = categoryItem.querySelector('.category-features');
                categoryHeader.addEventListener('click', () => {
                    categoryFeatures.classList.toggle('hidden');
                    const icon = categoryHeader.querySelector('i');
                    if (categoryFeatures.classList.contains('hidden')) {
                        icon.className = 'fas fa-folder mr-2';
                    } else {
                        icon.className = 'fas fa-folder-open mr-2';
                    }
                });
            });

            // Populate Information Types
            informationTypes.forEach(infoType => {
                const infoItem = document.createElement('div');
                infoItem.className = 'sidebar-item cursor-pointer hover:bg-gray-700 px-2 py-1 rounded flex items-center';
                infoItem.setAttribute('data-id', infoType.id);
                infoItem.setAttribute('data-type', 'infoType');
                infoItem.innerHTML = `
                    <i class="fas fa-info-circle mr-2 text-green-300"></i>
                    <span>${infoType.name}</span>
                `;
                infoTypesEl.appendChild(infoItem);
            });

            // Populate Attributes
            attributes.forEach(attr => {
                const attrItem = document.createElement('div');
                attrItem.className = 'sidebar-item cursor-pointer hover:bg-gray-700 px-2 py-1 rounded flex items-center';
                attrItem.setAttribute('data-id', attr.id);
                attrItem.setAttribute('data-type', 'attribute');
                attrItem.innerHTML = `
                    <i class="fas fa-tag mr-2 text-yellow-300"></i>
                    <span>${attr.name}</span>
                `;
                attributesListEl.appendChild(attrItem);
            });

            // Add click event to all sidebar items
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = item.getAttribute('data-id');
                    const type = item.getAttribute('data-type');
                    
                    // Remove active class from all items
                    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                    
                    // Add active class to clicked item
                    item.classList.add('active');
                    
                    // Show details for selected item
                    if (type === 'feature') {
                        showFeatureDetails(id);
                    } else if (type === 'infoType') {
                        showInfoTypeDetails(id);
                    } else if (type === 'attribute') {
                        showAttributeDetails(id);
                    }

                    // Close sidebar on mobile after selection
                    if (window.innerWidth < 768) {
                        sidebar.classList.remove('open');
                    }
                });
            });
        }

        // Function to show feature details
        function showFeatureDetails(featureId) {
            const feature = features[featureId];
            currentPathEl.textContent = `Features > ${feature.category} > ${feature.name}`;
            
            // Show feature details
            contentDetailsEl.innerHTML = `
                <h2 class="text-xl font-semibold mb-2">${feature.name}</h2>
                <div class="bg-blue-50 p-3 rounded mb-4">
                    <p class="text-gray-800">${feature.definition}</p>
                </div>
                
                <h3 class="font-medium text-lg mb-2">Attributes</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-4">
                    ${feature.attributes.map(attrId => {
                        const attr = attributes.find(a => a.name === attrId);
                        return attr ? `
                            <div class="bg-gray-100 p-2 rounded flex items-center">
                                <i class="fas fa-tag text-yellow-500 mr-2"></i>
                                <span>${attr.name}</span>
                                <span class="ml-auto text-sm text-gray-500">${attr.type}</span>
                            </div>
                        ` : '';
                    }).join('')}
                </div>
                
                <h3 class="font-medium text-lg mb-2">Associations</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    ${feature.associations.length > 0 ? feature.associations.map(assocId => {
                        const assoc = associations[assocId];
                        return assoc ? `
                            <div class="bg-gray-100 p-2 rounded flex items-center">
                                <i class="fas fa-link text-purple-500 mr-2"></i>
                                <span>${assoc.name}</span>
                            </div>
                        ` : '';
                    }).join('') : '<p class="text-gray-500">No associations defined</p>'}
                </div>
            `;

            // Show DCEG content
            if (feature.dceg) {
                document.getElementById('content-dceg').innerHTML = `
                    <h2 class="text-xl font-semibold mb-4">${feature.name} - DCEG Guidance</h2>
                    
                    <div class="mb-4">
                        <h3 class="font-medium text-lg mb-2">Description</h3>
                        <p class="text-gray-800">${feature.dceg.description}</p>
                    </div>
                    
                    <div class="mb-4">
                        <h3 class="font-medium text-lg mb-2">Encoding Instructions</h3>
                        <ul class="list-disc pl-5 space-y-1">
                            ${feature.dceg.encoding.map(instruction => `<li>${instruction}</li>`).join('')}
                        </ul>
                    </div>
                    
                    <div>
                        <h3 class="font-medium text-lg mb-2">Remarks</h3>
                        <ul class="list-disc pl-5 space-y-1">
                            ${feature.dceg.remarks.map(remark => `<li>${remark}</li>`).join('')}
                        </ul>
                    </div>
                `;
            } else {
                document.getElementById('content-dceg').innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-exclamation-circle text-4xl mb-2"></i>
                        <p>No DCEG guidance available for this feature.</p>
                    </div>
                `;
            }

            // Activate details tab
            activateTab('tab-details');
        }

        // Function to show information type details
        function showInfoTypeDetails(infoTypeId) {
            const infoType = informationTypes.find(info => info.id === infoTypeId);
            currentPathEl.textContent = `Information Types > ${infoType.name}`;
            
            contentDetailsEl.innerHTML = `
                <h2 class="text-xl font-semibold mb-2">${infoType.name}</h2>
                <div class="bg-green-50 p-3 rounded mb-4">
                    <p class="text-gray-800">An information type that provides additional details for features.</p>
                </div>
                
                <h3 class="font-medium text-lg mb-2">Related Features</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    ${associations[infoTypeId] ? 
                        associations[infoTypeId].relatedTo.map(featureId => `
                            <div class="bg-gray-100 p-2 rounded flex items-center">
                                <i class="fas fa-map-marker-alt text-blue-500 mr-2"></i>
                                <span>${features[featureId].name}</span>
                            </div>
                        `).join('') : 
                        '<p class="text-gray-500">No related features defined</p>'
                    }
                </div>
            `;

            // Clear DCEG content
            document.getElementById('content-dceg').innerHTML = `
                <div class="text-center py-8 text-gray-500">
                    <i class="fas fa-exclamation-circle text-4xl mb-2"></i>
                    <p>DCEG guidance is not applicable to information types.</p>
                </div>
            `;

            // Activate details tab
            activateTab('tab-details');
        }

        // Function to show attribute details
        function showAttributeDetails(attrId) {
            const attr = attributes.find(a => a.id === attrId);
            currentPathEl.textContent = `Attributes > ${attr.name}`;
            
            contentDetailsEl.innerHTML = `
                <h2 class="text-xl font-semibold mb-2">${attr.name}</h2>
                <div class="bg-yellow-50 p-3 rounded mb-4">
                    <p class="text-gray-800">A ${attr.type} attribute used to describe properties of features.</p>
                </div>
                
                <h3 class="font-medium text-lg mb-2">Used By Features</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    ${Object.values(features)
                        .filter(feature => feature.attributes.includes(attr.name))
                        .map(feature => `
                            <div class="bg-gray-100 p-2 rounded flex items-center">
                                <i class="fas fa-map-marker-alt text-blue-500 mr-2"></i>
                                <span>${feature.name}</span>
                            </div>
                        `).join('')
                    }
                </div>
            `;


            // Clear DCEG content
            document.getElementById('content-dceg').innerHTML = `
                <div class="text-center py-8 text-gray-500">
                    <i class="fas fa-exclamation-circle text-4xl mb-2"></i>
                    <p>DCEG guidance specific to attributes is not available.</p>
                </div>
            `;

            // Activate details tab
            activateTab('tab-details');
        }


        // Function to activate a tab
        function activateTab(tabId) {
            // Hide all tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            
            // Remove active class from all tab buttons
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });
            
            // Show selected tab content
            let contentId;
            if (tabId === 'tab-details') {
                contentId = 'content-details';
                document.getElementById('tab-details').classList.add('active');
            } else if (tabId === 'tab-relationships') {
                contentId = 'content-relationships';
                document.getElementById('tab-relationships').classList.add('active');
            } else if (tabId === 'tab-dceg') {
                contentId = 'content-dceg';
                document.getElementById('tab-dceg').classList.add('active');
            }
            
            document.getElementById(contentId).classList.remove('hidden');
        }

        // Function to handle search
        function handleSearch() {
            const query = searchInput.value.toLowerCase().trim();
            
            if (query.length < 2) {
                searchResults.classList.add('hidden');
                return;
            }
            
            // Search in features
            const matchingFeatures = Object.values(features).filter(feature => 
                feature.name.toLowerCase().includes(query) || 
                feature.definition.toLowerCase().includes(query)
            );
            
            // Search in attributes
            const matchingAttributes = attributes.filter(attr => 
                attr.name.toLowerCase().includes(query)
            );
            
            // Search in information types
            const matchingInfoTypes = informationTypes.filter(info => 
                info.name.toLowerCase().includes(query)
            );
            
            // Display results
            if (matchingFeatures.length > 0 || matchingAttributes.length > 0 || matchingInfoTypes.length > 0) {
                resultsContainer.innerHTML = '';
                
                // Add feature results
                if (matchingFeatures.length > 0) {
                    matchingFeatures.forEach(feature => {
                        const resultItem = document.createElement('div');
                        resultItem.className = 'p-2 hover:bg-gray-100 rounded cursor-pointer flex items-center';
                        resultItem.innerHTML = `
                            <i class="fas fa-map-marker-alt text-blue-500 mr-2"></i>
                            <div>
                                <div class="font-medium">${feature.name}</div>
                                <div class="text-sm text-gray-600">${feature.category}</div>
                            </div>
                        `;
                        resultItem.addEventListener('click', () => {
                            showFeatureDetails(feature.id);
                            searchResults.classList.add('hidden');
                            searchInput.value = '';
                        });
                        resultsContainer.appendChild(resultItem);
                    });
                }
                
                // Add attribute results
                if (matchingAttributes.length > 0) {
                    matchingAttributes.forEach(attr => {
                        const resultItem = document.createElement('div');
                        resultItem.className = 'p-2 hover:bg-gray-100 rounded cursor-pointer flex items-center';
                        resultItem.innerHTML = `
                            <i class="fas fa-tag text-yellow-500 mr-2"></i>
                            <div>
                                <div class="font-medium">${attr.name}</div>
                                <div class="text-sm text-gray-600">Attribute (${attr.type})</div>
                            </div>
                        `;
                        resultItem.addEventListener('click', () => {
                            showAttributeDetails(attr.id);
                            searchResults.classList.add('hidden');
                            searchInput.value = '';
                        });
                        resultsContainer.appendChild(resultItem);
                    });
                }
                
                // Add information type results
                if (matchingInfoTypes.length > 0) {
                    matchingInfoTypes.forEach(info => {
                        const resultItem = document.createElement('div');
                        resultItem.className = 'p-2 hover:bg-gray-100 rounded cursor-pointer flex items-center';
                        resultItem.innerHTML = `
                            <i class="fas fa-info-circle text-green-500 mr-2"></i>
                            <div>
                                <div class="font-medium">${info.name}</div>
                                <div class="text-sm text-gray-600">Information Type</div>
                            </div>
                        `;
                        resultItem.addEventListener('click', () => {
                            showInfoTypeDetails(info.id);
                            searchResults.classList.add('hidden');
                            searchInput.value = '';
                        });
                        resultsContainer.appendChild(resultItem);
                    });
                }
                
                searchResults.classList.remove('hidden');
            } else {
                resultsContainer.innerHTML = '<div class="p-2 text-gray-500">No matching items found</div>';
                searchResults.classList.remove('hidden');
            }
        }

        // Initialize the application
        function init() {
            // Populate sidebar
            populateSidebar();
            
            // Add event listeners for tabs
            tabDetails.addEventListener('click', () => activateTab('tab-details'));
            tabDceg.addEventListener('click', () => activateTab('tab-dceg'));
            
            // Add search functionality
            searchInput.addEventListener('input', handleSearch);
            searchInput.addEventListener('blur', () => {
                // Delay hiding results to allow for clicking
                setTimeout(() => {
                    searchResults.classList.add('hidden');
                }, 200);
            });
            
            // Mobile menu toggle
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });
            
            // Handle resize to adjust sidebar on desktop
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768) {
                    sidebar.classList.remove('open');
                }
            });
        }

        // Initialize on page load
        window.addEventListener('load', init);
    </script>
</body>
</html>
